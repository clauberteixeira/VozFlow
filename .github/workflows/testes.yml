name: testes

on:
  push:
  pull_request:

jobs:
  testes:
    # Windows de proposito: atalhos, foco de janela e audio sao Win32.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (erros de sintaxe e nomes indefinidos)
        run: ruff check --select E9,F63,F7,F82 vozflow main.py tests
      - name: Testes
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
